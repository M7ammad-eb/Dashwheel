name: Debug APK

# A personal build of the launcher for sideloading: optimized like a release
# (R8, ARM only) and signed with this fork's own key, so each build installs
# over the last without wiping the app's setup. Nothing is published: the APK
# is a workflow artifact only. Needs the DW_* secrets (Settings > Secrets).
on:
  workflow_dispatch:
  push:
    branches: [fix/now-playing]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare signing key
        env:
          DW_KEYSTORE_BASE64: ${{ secrets.DW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DW_KEYSTORE_BASE64" ]; then
            echo "::error::Add the DW_KEYSTORE_BASE64, DW_KEYSTORE_PASSWORD, DW_KEY_ALIAS and DW_KEY_PASSWORD secrets first."
            exit 1
          fi
          echo "$DW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dw.keystore"

      # Each build's version grows with the run number, so it installs over the last one.
      - name: Build the launcher (GitHub edition, release, own key)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/dw.keystore
          KEYSTORE_PASSWORD: ${{ secrets.DW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DW_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}0
          VERSION_NAME: personal-${{ github.run_number }}
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dashwheel-launcher
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
