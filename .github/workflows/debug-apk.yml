name: Debug APK

# A debug build of the launcher for sideloading on a phone, with no signing
# secrets needed. Run it from the Actions tab (Run workflow) on any branch.
on:
  workflow_dispatch:
  push:
    branches: [fix/now-playing]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build the launcher (GitHub edition, debug)
        run: ./gradlew :app:assembleGithubDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dashwheel-launcher-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
