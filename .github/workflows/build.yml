name: Verify Topway media build

on:
  push:
    branches:
      - verify/topway-media-build

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Lint
        run: ./gradlew :app:lintGithubDebug :companion:lintGithubDebug --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testGithubDebugUnitTest :companion:testGithubDebugUnitTest :link:test :display:test :unitproto:test :roadreplay:test --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug :companion:assembleGithubDebug --stacktrace
      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-debug-apks
          path: |
            app/build/outputs/apk/github/debug/*.apk
            companion/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
