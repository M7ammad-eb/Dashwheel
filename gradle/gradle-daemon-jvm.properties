# The JDK the Gradle daemon runs on: any Java 21. No vendor is pinned, so the JDK
# CI installs (Temurin) and a developer's own are taken as they are; Gradle only
# downloads one (through the foojay resolver in settings.gradle.kts) when none is
# installed. A vendor pin here made every CI run fetch a second, unverified JDK.
toolchainVersion=21
